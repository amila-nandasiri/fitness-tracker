<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Fitness" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#0f766e" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Fitness Tracker</title>
<style>
:root{
  --bg:#f6f7f8;--card:#fff;--text:#16202a;--muted:#5b6875;--line:#e3e7eb;
  --accent:#0f766e;--accent-soft:#d9f0ed;--warn:#b45309;--bad:#b91c1c;--good:#15803d;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1316;--card:#182026;--text:#e8edf1;--muted:#9aa7b3;--line:#2a343c;
  --accent:#2dd4bf;--accent-soft:#12332f;--warn:#fbbf24;--bad:#f87171;--good:#4ade80;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);
  padding:0 0 calc(76px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}
.muted{color:var(--muted);font-size:13px}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme:dark){.btn{color:#06201d}}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.check .n{font-weight:600}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0;padding-top:0}
.ex img.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg);cursor:pointer}
.ex .big{display:flex;gap:6px;margin-top:8px}
.ex .big img{width:50%;border-radius:8px;cursor:zoom-in;touch-action:manipulation}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#zoom[hidden]{display:none}
#zoom img{max-width:100%;max-height:78vh;border-radius:10px;touch-action:manipulation}
#zoom p{color:#fff;font-size:14px;margin:0;text-align:center}
#zoom button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:22px;cursor:pointer}
.sets{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center;margin-top:8px}
.sets .h{font-size:12px;color:var(--muted)}
.sets input{padding:7px 8px;text-align:center}
.tip{font-size:13px;color:var(--good);margin-top:6px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.tabs button.on{color:#06201d}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:144px;background:none;border:0;padding:10px 2px 8px;font-size:11px;color:var(--muted);cursor:pointer}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px;border-top:0}
td.x{text-align:right}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.meal{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.notice{border-left:3px solid var(--warn);padding:8px 12px;font-size:14px;background:var(--bg);border-radius:0 10px 10px 0;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<div id="zoom" hidden role="dialog" aria-label="Exercise photo"><button aria-label="Close">✕</button><img alt=""><p></p></div>
<nav id="nav"></nav>
<script>
'use strict';
/* ---------- Plan ---------- */
const IMG = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
const E = (id, name, sets, lo, hi, unit) => ({ id, name, sets, lo, hi, unit: unit || 'reps' });
const WORKOUTS = {
  chest: { name: 'Chest & Biceps', focus: 'Day 1', ex: [
    E('Barbell_Bench_Press_-_Medium_Grip', 'Bench press', 4, 6, 8),
    E('Incline_Dumbbell_Press', 'Incline dumbbell press', 3, 8, 10),
    E('Cable_Crossover', 'Cable crossover', 3, 12, 15),
    E('Incline_Dumbbell_Curl', 'Incline dumbbell curl', 3, 10, 12),
    E('Preacher_Curl', 'Preacher curl', 3, 10, 12),
    E('Hammer_Curls', 'Hammer curl', 2, 10, 12) ] },
  back: { name: 'Back & Triceps', focus: 'Day 2', ex: [
    E('Pullups', 'Pull-ups (assisted if needed)', 3, 5, 12),
    E('Bent_Over_Barbell_Row', 'Barbell row', 4, 8, 10),
    E('Wide-Grip_Lat_Pulldown', 'Lat pulldown', 3, 10, 12),
    E('Seated_Cable_Rows', 'Seated row', 3, 10, 12),
    E('EZ-Bar_Skullcrusher', 'Barbell skull crusher', 3, 10, 12),
    E('Triceps_Pushdown_-_Rope_Attachment', 'Rope pushdown', 3, 12, 15),
    E('Hanging_Leg_Raise', 'Hanging leg raise', 3, 10, 12) ] },
  legs: { name: 'Legs', focus: 'Day 4', ex: [
    E('Smith_Machine_Squat', 'Smith machine squat', 4, 6, 8),
    E('Romanian_Deadlift', 'Romanian deadlift', 3, 8, 10),
    E('Leg_Press', 'Leg press', 3, 10, 12),
    E('Bodyweight_Walking_Lunge', 'Walking lunges (per leg)', 3, 10, 12),
    E('Lying_Leg_Curls', 'Leg curl', 3, 10, 12),
    E('Leg_Extensions', 'Leg extension', 3, 12, 15),
    E('Standing_Calf_Raises', 'Calf raise', 4, 12, 15) ] },
  shoulders: { name: 'Shoulders & Abs', focus: 'Day 5', ex: [
    E('Standing_Military_Press', 'Military press', 4, 6, 8),
    E('Side_Lateral_Raise', 'Dumbbell side raise', 4, 12, 15),
    E('Reverse_Flyes', 'Rear delt fly', 3, 12, 15),
    E('Face_Pull', 'Face pull', 3, 12, 15),
    E('Dumbbell_Shrug', 'Dumbbell shrug', 3, 10, 12),
    E('Cable_Crunch', 'Cable crunch', 3, 12, 15),
    E('Plank', 'Plank', 3, 45, 60, 'sec') ] },
  upper: { name: 'Upper', focus: 'Day 6 · chest, back, arms', ex: [
    E('Incline_Dumbbell_Press', 'Incline dumbbell press', 3, 8, 10),
    E('Underhand_Cable_Pulldowns', 'Reverse-grip lat pulldown', 3, 8, 10),
    E('Butterfly', 'Butterfly machine fly', 3, 12, 15),
    E('T-Bar_Row_with_Handle', 'T-bar row', 3, 8, 10),
    E('Barbell_Curl', 'Barbell curl', 3, 10, 12),
    E('Standing_Dumbbell_Triceps_Extension', 'Dumbbell overhead extension', 3, 10, 12),
    E('Triceps_Pushdown', 'Straight-bar pushdown', 2, 12, 15) ] },
};
const DEFAULT_SCHEDULE = ['chest', 'back', '', 'legs', 'shoulders', 'upper', ''];
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DEFAULT_SUPPS = [
  { id: 'creatine', name: 'Creatine monohydrate', dose: '3–5 g', when: 'Any time, every day' },
  { id: 'whey', name: 'Whey protein', dose: '1 scoop', when: 'After training or to hit protein' },
  { id: 'multi', name: 'Multivitamin', dose: '1 tablet', when: 'With breakfast' },
  { id: 'omega3', name: 'Omega 3 fish oil', dose: '1–2 capsules', when: 'With a meal' },
  { id: 'camgzn', name: 'Calcium Magnesium Zinc + D3 K2', dose: 'Per label', when: 'With dinner' },
  { id: 'alcar', name: 'Acetyl-L-carnitine', dose: '1 capsule', when: 'Morning or before training' },
];

/* ---------- State ---------- */
const KEY = 'fitness-tracker-v1', TOKEN_KEY = 'fitness-tracker-token', GEM_KEY = 'fitness-tracker-gemini', GEM_MODEL_KEY = 'fitness-tracker-gemini-model';
const fresh = () => ({ v: 1, updatedAt: 0, profile: null,
  schedule: DEFAULT_SCHEDULE.slice(),
  supplements: DEFAULT_SUPPS, days: {}, weights: [], measures: [], sessions: [],
  sync: { owner: '', repo: '', path: 'fitness-data.json' } });
let S = load();
let tab = 'today', selWorkout = null, progEx = null, meal = null;
function load() {
  try { return fix(Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {})); } catch (e) { return fresh(); }
}
function fix(st) { // a schedule saved under an older plan may name workouts that no longer exist
  if (!Array.isArray(st.schedule) || st.schedule.length !== 7 || st.schedule.some(k => k && !WORKOUTS[k])) st.schedule = DEFAULT_SCHEDULE.slice();
  return st;
}
function save(skipSync) {
  S.updatedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(S));
  if (!skipSync) queuePush();
}
/* ---------- Helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iso = d => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const today = () => iso();
const toDate = s => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const nice = s => toDate(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const r1 = n => Math.round(n * 10) / 10;
const dayIdx = d => ((d || new Date()).getDay() + 6) % 7;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); }
const sortedWeights = () => S.weights.slice().sort((a, b) => a.d < b.d ? -1 : 1);
function avg7(ws, i) { // average of entries within the 7 days ending at entry i
  const end = toDate(ws[i].d).getTime(); let sum = 0, n = 0;
  for (let j = i; j >= 0 && end - toDate(ws[j].d).getTime() < 7 * 864e5; j--) { sum += ws[j].kg; n++; }
  return sum / n;
}
function targets() {
  const p = S.profile; if (!p) return null;
  const ws = sortedWeights(), w = ws.length ? ws[ws.length - 1].kg : p.startWeight;
  const bmr = 10 * w + 6.25 * p.height - 5 * p.age + (p.sex === 'female' ? -161 : 5);
  const tdee = bmr * 1.5;
  return { w, bmr: Math.round(bmr), tdee: Math.round(tdee / 10) * 10,
    kcal: Math.round((tdee - 450) / 50) * 50, protein: Math.round(1.8 * w / 5) * 5 };
}
const meals = d => (S.days[d] && S.days[d].meals) || [];
const dayTotals = d => { const r = S.days[d] || {}, m = meals(d), sum = k => m.reduce((a, x) => a + (x[k] || 0), 0);
  return { kcal: Math.round(sum('kcal')), protein: Math.round((r.protein || 0) + sum('protein')), carbs: Math.round(sum('carbs')), fat: Math.round(sum('fat')) }; };
const dayRec = d => S.days[d] || (S.days[d] = { checks: {}, protein: 0 });
const lastSession = (exId, before) => S.sessions.filter(s => s.sets[exId] && (!before || s.d < before)).sort((a, b) => a.d < b.d ? 1 : -1)[0];

/* ---------- Views ---------- */
const ICONS = {
  today: '<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>',
  workout: '<path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/>',
  log: '<path d="M12 5v14M5 12h14"/>',
  progress: '<path d="M4 19V5M4 19h16M8 15l4-5 3 3 4-6"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
};
function renderNav() {
  $('#nav').innerHTML = Object.keys(ICONS).map(k =>
    `<button class="${tab === k ? 'on' : ''}" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${k[0].toUpperCase() + k.slice(1)}</button>`).join('');
}
function render() {
  if (!S.profile && tab !== 'settings') tab = 'settings';
  renderNav();
  $('#app').innerHTML = ({ today: vToday, workout: vWorkout, log: vLog, progress: vProgress, settings: vSettings })[tab]();
}

function vToday() {
  const d = today(), rec = S.days[d] || { checks: {}, protein: 0 }, t = targets();
  const wk = S.schedule[dayIdx()], w = WORKOUTS[wk];
  const done = S.sessions.some(s => s.d === d);
  const ws = sortedWeights(), todayW = ws.find(x => x.d === d);
  const tot = dayTotals(d), pct = Math.min(100, Math.round(tot.protein / t.protein * 100)), kpct = Math.min(100, Math.round(tot.kcal / t.kcal * 100));
  const left = t.kcal - tot.kcal;
  return `
  <h1>${new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}</h1>
  <p class="sub">Target today: about ${t.kcal} kcal and ${t.protein} g protein</p>
  <div class="card">
    <div class="row"><div class="grow"><h2 style="margin:0">${w ? esc(w.name) + '' : 'Rest day'}</h2>
      <div class="muted">${w ? esc(w.focus) + ' · ' + w.ex.length + ' exercises · 5 min warm-up, 15–20 min cardio after' : 'Walk 8–10k steps, stretch, sleep well'}</div></div>
      ${w ? (done ? '<span class="pill">Logged</span>' : `<button class="btn" data-act="start" data-w="${wk}">Start</button>`) : ''}</div>
  </div>
  <div class="card">
    <h2>Morning weight</h2>
    <div class="row"><div class="grow"><input id="tw" inputmode="decimal" placeholder="kg" value="${todayW ? todayW.kg : ''}" aria-label="Weight in kg"></div>
      <button class="btn" data-act="saveTodayWeight">Save</button></div>
    <div class="muted" style="margin-top:6px">Weigh after waking, after the toilet, before eating.</div>
  </div>
  <div class="card">
    <div class="row"><h2 class="grow" style="margin:0">Calories</h2><b>${tot.kcal} / ${t.kcal} kcal</b></div>
    <div class="bar"><i style="width:${kpct}%${left < -100 ? ';background:var(--warn)' : ''}"></i></div>
    <div class="row"><h2 class="grow" style="margin:0">Protein</h2><b>${tot.protein} / ${t.protein} g</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="muted">${left >= 0 ? left + ' kcal left today' : -left + ' kcal over target'} · carbs ${tot.carbs} g · fat ${tot.fat} g</div>
  </div>
  <div class="card">
    <h2>Meals</h2>
    ${meal ? mealPanel() : `<div class="row">
      <button class="btn grow" data-act="snap">Snap meal</button>
      <button class="btn ghost" data-act="manualMeal">Add manually</button>
      <button class="btn ghost" data-act="scoop">+ Whey scoop</button></div>
    <input type="file" id="mealFile" accept="image/*" capture="environment" hidden>`}
    ${meals(d).map(m => `<div class="meal"><div class="grow"><b style="font-size:15px">${esc(m.name)}</b><div class="muted">${m.kcal} kcal · ${m.protein} g protein${m.detail ? ' · ' + esc(m.detail) : ''}</div></div>
      <button class="linkbtn" data-act="delMeal" data-id="${m.id}" aria-label="Delete ${esc(m.name)}">✕</button></div>`).join('')}
  </div>
  <div class="card">
    <h2>Supplements</h2>
    ${S.supplements.map(s => `<label class="check"><input type="checkbox" data-check="${esc(s.id)}" ${rec.checks[s.id] ? 'checked' : ''}>
      <span><span class="n" style="color:var(--text);font-size:15px">${esc(s.name)}</span><br><span class="muted">${esc(s.dose)} · ${esc(s.when)}</span></span></label>`).join('') || '<div class="muted">None set. Add them in Settings.</div>'}
  </div>
  <div class="card">
    <h2>Steps today</h2>
    <div class="row"><div class="grow"><input id="steps" inputmode="numeric" placeholder="From your Apple Watch" value="${rec.steps || ''}" aria-label="Steps"></div>
      <button class="btn ghost" data-act="saveSteps">Save</button></div>
  </div>`;
}

function mealPanel() {
  const r = meal.res || {}, f = (id, label, v, mode) => `<div><label for="${id}">${label}</label><input id="${id}" inputmode="${mode || 'numeric'}" value="${v != null ? esc(v) : ''}"></div>`;
  return `${meal.img ? `<img class="preview" alt="Meal photo" src="${meal.img}">` : ''}
    ${meal.img ? `<label for="ml_note">Note for a better estimate (optional)</label><input id="ml_note" placeholder="e.g. 2 cups rice, fried in coconut oil" value="${esc(meal.note || '')}">
    <div class="row" style="margin:10px 0"><button class="btn grow" data-act="analyse" ${meal.busy ? 'disabled' : ''}>${meal.busy ? 'Analysing…' : meal.res ? 'Analyse again' : 'Estimate calories'}</button></div>` : ''}
    ${meal.err ? `<div class="err">${esc(meal.err)}</div>` : ''}
    ${meal.res || !meal.img ? `<div style="margin-top:6px">${f('ml_name', 'Meal', r.name, 'text')}</div>
    <div class="grid" style="margin-top:10px">${f('ml_kcal', 'Calories (kcal)', r.kcal)}${f('ml_protein', 'Protein (g)', r.protein)}${f('ml_carbs', 'Carbs (g)', r.carbs)}${f('ml_fat', 'Fat (g)', r.fat)}</div>
    ${r.detail ? `<div class="muted" style="margin-top:8px">${esc(r.detail)}${r.confidence ? ' · confidence: ' + esc(r.confidence) : ''}. Estimates can be off by 20–40%; correct the numbers if you know better.</div>` : ''}` : ''}
    <div class="row" style="margin:10px 0 4px">${meal.res || !meal.img ? '<button class="btn grow" data-act="addMeal">Add to today</button>' : ''}<button class="btn ghost ${meal.res || !meal.img ? '' : 'grow'}" data-act="cancelMeal">Cancel</button></div>`;
}
function readMealInputs() { if (!meal) return; const g = id => $('#' + id);
  if (g('ml_note')) meal.note = g('ml_note').value;
  if (g('ml_name')) meal.res = Object.assign(meal.res || {}, { name: g('ml_name').value, kcal: g('ml_kcal').value, protein: g('ml_protein').value, carbs: g('ml_carbs').value, fat: g('ml_fat').value }); }
function shrink(file) { // downscale the photo so the upload is small
  return new Promise((ok, bad) => { const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => { const k = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.8)); };
    im.onerror = () => { URL.revokeObjectURL(u); bad(new Error('Could not read that photo')); }; im.src = u; });
}
const GEM = 'https://generativelanguage.googleapis.com/v1beta/';

async function gemModel(refresh) { // newest general Flash model the key can use

}
async function analyseMeal() {
  const prompt = 'Estimate the nutrition of the meal in this photo. Identify each food, estimate its portion, and include cooking oil or sauces that are likely present. ' +
    (meal.note ? 'The person adds this note, which overrides what you see: "' + meal.note + '". ' : '') +
    'Reply with JSON only, in this shape: {"name": short meal name, "items": [{"name": string, "portion": string, "kcal": number}], "kcal": total number, "protein_g": number, "carbs_g": number, "fat_g": number, "confidence": "low" | "medium" | "high"}. If the photo shows no food, reply {"error": "reason"}.';
  const body = { contents: [{ parts: [{ inline_data: { mime_type: 'image/jpeg', data: meal.img.split(',')[1] } }, { text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0.2 } };
  let j;
  try { j = await gemFetch('models/' + await gemModel() + ':generateContent', body); }
  catch (e) { if (e.status !== 404) throw e; j = await gemFetch('models/' + await gemModel(true) + ':generateContent', body); }
  const txt = ((((j.candidates || [])[0] || {}).content || {}).parts || []).map(p => p.text || '').join('');
  let o; try { o = JSON.parse(txt.replace(/^```(?:json)?|```$/gm, '').trim()); } catch (e) { throw new Error('Gemini gave an unreadable answer. Try again.'); }
  if (Array.isArray(o)) o = o[0] || {};
  if (o.error || o.kcal == null) throw new Error(o.error || 'No estimate returned. Try another photo.');
  return { name: o.name || 'Meal', kcal: Math.round(o.kcal), protein: Math.round(o.protein_g || 0), carbs: Math.round(o.carbs_g || 0), fat: Math.round(o.fat_g || 0), confidence: o.confidence,
    detail: (o.items || []).map(i => i.name + (i.portion ? ' (' + i.portion + ')' : '')).join(', ') };
}

function chart(series, opt) {
  // series: [{color, pts:[{t,y}], dots, dash, width}]
  opt = opt || {};
  const all = series.flatMap(s => s.pts); if (all.length < 2) return '<div class="muted">Add at least two entries to see a chart.</div>';
  const W = 640, H = 240, L = 40, R = 12, T = 12, B = 26;
  let x0 = Math.min(...all.map(p => p.t)), x1 = Math.max(...all.map(p => p.t));
  let ys = all.map(p => p.y); if (opt.goal != null) ys.push(opt.goal);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = Math.max((y1 - y0) * 0.12, 0.5); y0 -= pad; y1 += pad;
  if (x1 === x0) x1 = x0 + 864e5;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = y => T + (y1 - y) / (y1 - y0) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = y0 + (y1 - y0) * i / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(y) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${r1(y)}</text>`; }
  [x0, (x0 + x1) / 2, x1].forEach((t, i) => { g += `<text x="${X(t)}" y="${H - 6}" text-anchor="${['start', 'middle', 'end'][i]}" font-size="11" fill="var(--muted)">${new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</text>`; });
  if (opt.goal != null) g += `<line x1="${L}" x2="${W - R}" y1="${Y(opt.goal)}" y2="${Y(opt.goal)}" stroke="var(--good)" stroke-dasharray="5 5" stroke-width="1.5"/>`;
  series.forEach(s => {
    if (!s.dotsOnly) g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" stroke-linejoin="round" stroke-linecap="round" points="${s.pts.map(p => X(p.t).toFixed(1) + ',' + Y(p.y).toFixed(1)).join(' ')}"/>`;
    if (s.dots || s.dotsOnly) g += s.pts.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${s.dotsOnly ? 3 : 3.5}" fill="${s.color}"><title>${new Date(p.t).toLocaleDateString()}: ${r1(p.y)}</title></circle>`).join('');
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Chart')}">${g}</svg>`;
}

/* ---------- Sync (private GitHub repo) ---------- */
let syncMsg = 'Sync is off.', pushTimer = null, remoteSha = null, syncing = false;
const syncOn = () => !!(S.sync.owner && S.sync.repo && localStorage.getItem(TOKEN_KEY));
function setSync(m) { syncMsg = m; const el = $('#syncStatus'); if (el) el.textContent = m; }
const b64e = s => { const b = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(o); };

async function gh(method, body) {
  const url = `https://api.github.com/repos/${encodeURIComponent(S.sync.owner)}/${encodeURIComponent(S.sync.repo)}/contents/${S.sync.path}`;
  const r = await fetch(url + (method === 'GET' ? '?t=' + Date.now() : ''), { method, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY), Accept: 'application/vnd.github+json' },
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 404 && method === 'GET') return null;
  if (!r.ok) throw new Error(r.status === 401 ? 'Token rejected' : r.status === 404 ? 'Repo not found or token lacks access' : 'GitHub error ' + r.status);
  return r.json();
}
async function pull() {
  const f = await gh('GET'); if (!f) { remoteSha = null; return false; }
  remoteSha = f.sha;
  const remote = JSON.parse(b64d(f.content));
  if ((remote.updatedAt || 0) > (S.updatedAt || 0)) {
    S = fix(Object.assign(fresh(), remote)); localStorage.setItem(KEY, JSON.stringify(S)); return true;
  }
  return false;
}
async function push() {
  const res = await gh('PUT', { message: 'Update fitness data', content: b64e(JSON.stringify(S)), sha: remoteSha || undefined });
  remoteSha = res.content.sha;
}
async function syncNow(pushAfter) {
  if (!syncOn() || syncing) return; syncing = true; setSync('Syncing…');
  try {
    const hadProfile = !!S.profile, changed = await pull();
    if (changed) { if (!hadProfile && S.profile) tab = 'today'; render(); }
    else if (pushAfter || (!remoteSha && S.profile)) await push();
    setSync('Synced ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '.');
  } catch (e) { setSync('Sync failed: ' + e.message + '. Your data is still saved on this device.'); }
  syncing = false;
}
function queuePush() { if (!syncOn()) return; clearTimeout(pushTimer); pushTimer = setTimeout(() => syncNow(true), 2500); }

/* ---------- Actions ---------- */
function upsertWeight(d, kg) { S.weights = S.weights.filter(x => x.d !== d); S.weights.push({ d, kg: r1(kg) }); }
function addMealRec(m) { const r = dayRec(today()); (r.meals = r.meals || []).push(Object.assign({ id: Date.now() }, m)); meal = null; save(); toast('Added'); render(); }
const ACT = {
  start(el) { selWorkout = el.dataset.w; tab = 'workout'; render(); scrollTo(0, 0); },
  pick(el) { selWorkout = el.dataset.w; render(); },
  img(el) { const big = el.closest('.ex').querySelector('.big');
    if (!big.innerHTML) big.innerHTML = [0, 1].map(i => `<img alt="" data-zoom="${i}" data-id="${el.dataset.id}" src="${IMG + el.dataset.id}/${i}.jpg" onerror="this.remove()">`).join('');
    big.hidden = !big.hidden; },
  saveTodayWeight() { const kg = num($('#tw').value); if (!kg || kg < 30 || kg > 300) return toast('Enter a weight in kg');
    upsertWeight(today(), kg); save(); toast('Weight saved'); render(); },
  snap() { if (!localStorage.getItem(GEM_KEY)) { toast('Add your Gemini key in Settings first'); tab = 'settings'; render(); return; } $('#mealFile').click(); },
  manualMeal() { meal = { res: {} }; render(); },
  cancelMeal() { meal = null; render(); },
  scoop() { addMealRec({ name: 'Whey scoop', kcal: 120, protein: 25, carbs: 3, fat: 2 }); },
  async analyse() { readMealInputs(); meal.busy = true; meal.err = ''; render(); const mine = meal;
    try { const res = await analyseMeal(); if (meal !== mine) return; meal.res = res; }
    catch (e) { if (meal !== mine) return; meal.err = e.message === 'Failed to fetch' ? 'No connection to Gemini. Check your internet.' : e.message; }
    meal.busy = false; render(); },
  addMeal() { readMealInputs(); const r = meal.res, kcal = num(r.kcal);
    if (kcal == null || kcal < 0) return toast('Enter the calories');
    addMealRec({ name: (r.name || '').trim() || 'Meal', kcal: Math.round(kcal), protein: Math.round(num(r.protein) || 0), carbs: Math.round(num(r.carbs) || 0), fat: Math.round(num(r.fat) || 0), detail: r.detail || '' }); },
  delMeal(el) { const r = dayRec(today()); r.meals = (r.meals || []).filter(m => String(m.id) !== el.dataset.id); save(); render(); },
  saveGem() { const k = $('#gem_key').value.trim(), m = $('#gem_model').value.trim();
    k ? localStorage.setItem(GEM_KEY, k) : localStorage.removeItem(GEM_KEY); m ? localStorage.setItem(GEM_MODEL_KEY, m) : localStorage.removeItem(GEM_MODEL_KEY);
    gemModel.auto = null; toast(k ? 'Gemini key saved' : 'Gemini key removed'); },
  saveSteps() { const n = num($('#steps').value); dayRec(today()).steps = n ? Math.round(n) : 0; save(); toast('Steps saved'); },
  saveWorkout() { const form = $('#wform'), wk = form.dataset.w, sets = {};
    WORKOUTS[wk].ex.forEach(e => { const arr = [];
      for (let i = 0; i < e.sets; i++) { const kg = num($(`[data-ex="${e.id}"][data-i="${i}"][data-f="kg"]`, form).value), reps = num($(`[data-ex="${e.id}"][data-i="${i}"][data-f="reps"]`, form).value);
        if (reps) arr.push(kg != null ? { kg, reps } : { reps }); }
      if (arr.length) sets[e.id] = arr; });
    if (!Object.keys(sets).length) return toast('Enter at least one set');
    S.sessions = S.sessions.filter(s => !(s.d === today() && s.w === wk)); S.sessions.push({ d: today(), w: wk, sets });
    save(); toast('Workout saved'); render(); },
  addWeight() { const kg = num($('#wk').value), d = $('#wd').value; if (!d || !kg || kg < 30 || kg > 300) return toast('Enter a date and weight');
    upsertWeight(d, kg); save(); toast('Weight added'); render(); },
  delW(el) { S.weights = S.weights.filter(x => x.d !== el.dataset.d); save(); render(); },
  addMeasure() { const d = $('#md').value, m = { d }; let any = false;
    MFIELDS.forEach(f => { const v = num($('#m_' + f[0]).value); if (v) { m[f[0]] = r1(v); any = true; } });
    if (!d || !any) return toast('Enter at least one measurement');
    const old = S.measures.find(x => x.d === d); S.measures = S.measures.filter(x => x.d !== d); S.measures.push(Object.assign({}, old, m));
    save(); toast('Measurements added'); render(); },
  delM(el) { S.measures = S.measures.filter(x => x.d !== el.dataset.d); save(); render(); },
  saveProfile() { const p = { sex: $('#p_sex').value, age: num($('#p_age').value), height: num($('#p_height').value), startWeight: num($('#p_start').value), goalWeight: num($('#p_goal').value) };
    if (!p.age || !p.height || !p.startWeight || !p.goalWeight) return toast('Fill in every field');
    const first = !S.profile; p.startDate = first ? today() : S.profile.startDate; S.profile = p;
    if (first && !S.weights.length) upsertWeight(today(), p.startWeight);
    save(); toast('Profile saved'); if (first) tab = 'today'; render(); },
  delSupp(el) { S.supplements.splice(+el.dataset.i, 1); save(); render(); },
  addSupp() { const name = $('#s_name').value.trim(); if (!name) return toast('Enter a name');
    S.supplements.push({ id: 's' + Date.now(), name, dose: $('#s_dose').value.trim() || '1', when: $('#s_when').value.trim() || 'Daily' }); save(); render(); },
  async saveSync() { S.sync.owner = $('#g_owner').value.trim(); S.sync.repo = $('#g_repo').value.trim();
    const t = $('#g_token').value.trim(); if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY);
    localStorage.setItem(KEY, JSON.stringify(S));
    if (!syncOn()) return setSync('Sync is off. Fill in all three fields to turn it on.');
    await syncNow(true); },
  export() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
    a.download = 'fitness-backup-' + today() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); },
  import() { $('#importFile').click(); },
  reset() { if (!confirm('Erase all fitness data on this device? This cannot be undone.')) return;
    [KEY, TOKEN_KEY, GEM_KEY, GEM_MODEL_KEY].forEach(k => localStorage.removeItem(k)); S = fresh(); tab = 'settings'; render(); },
};
let lastTap = { el: null, t: 0 }, zoomAt = null;
function showZoom(id, i) { zoomAt = { id, i }; const z = $('#zoom'); $('img', z).src = IMG + id + '/' + i + '.jpg';
  $('p', z).textContent = (i ? 'Finish' : 'Start') + ' position · tap the photo to switch'; z.hidden = false; }
document.addEventListener('click', e => {
  const z = e.target.closest('#zoom');
  if (z) { if (e.target.tagName === 'IMG') showZoom(zoomAt.id, zoomAt.i ? 0 : 1); else z.hidden = true; return; }
  const zi = e.target.closest('[data-zoom]');
  if (zi) { const now = Date.now(); if (lastTap.el === zi && now - lastTap.t < 400) { showZoom(zi.dataset.id, +zi.dataset.zoom); lastTap.el = null; } else lastTap = { el: zi, t: now }; return; }
  const n = e.target.closest('[data-tab]'); if (n) { tab = n.dataset.tab; selWorkout = null; render(); scrollTo(0, 0); return; }
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.check) { dayRec(today()).checks[t.dataset.check] = t.checked; save(); }
  else if (t.dataset.sch) { S.schedule[+t.dataset.sch] = t.value; save(); }
  else if (t.id === 'progEx') { progEx = t.value; render(); }
  else if (t.id === 'mealFile' && t.files[0]) { shrink(t.files[0]).then(img => { meal = { img }; render(); ACT.analyse(); }).catch(e => toast(e.message)); }
  else if (t.id === 'importFile' && t.files[0]) {
    t.files[0].text().then(txt => { const d = JSON.parse(txt); if (!d || !Array.isArray(d.weights)) throw 0;
      S = fix(Object.assign(fresh(), d)); save(); toast('Backup restored'); render(); }).catch(() => toast('That file is not a valid backup'));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#zoom').hidden = true; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(false); });
if (syncOn()) syncMsg = 'Sync is on.';
render();
syncNow(false);
</script>
